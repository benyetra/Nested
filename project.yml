name: Nested
options:
  bundleIdPrefix: com.yetra
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: 87A6J7UY87
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Cloudflare Worker for partner Live Activity / alarm pushes (see worker/README.md).
    # Leave empty to run without it; set in a local xcconfig or Xcode Cloud env.
    NEST_WORKER_URL: ""
    NEST_WORKER_KEY: ""

packages:
  NestedKit:
    path: NestedKit

targets:
  Nested:
    type: application
    platform: iOS
    attributes:
      SystemCapabilities:
        com.apple.iCloud:
          enabled: 1
        com.apple.ApplicationGroups.iOS:
          enabled: 1
        com.apple.Push:
          enabled: 1
    sources:
      - path: App
      - path: Shared
    dependencies:
      - package: NestedKit
        product: NestedCore
      - package: NestedKit
        product: NestedData
      - target: NestedWidgets
      - target: NestedWatch
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch
    entitlements:
      path: App/Nested.entitlements
      properties:
        aps-environment: development
        com.apple.developer.usernotifications.time-sensitive: true
        com.apple.developer.icloud-container-identifiers: [iCloud.com.yetra.nest]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.security.application-groups: [group.com.yetra.nest]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yetra.nest
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets:
        - NestedTests
      gatherCoverageData: false

  NestedWidgets:
    type: app-extension
    platform: iOS
    attributes:
      SystemCapabilities:
        com.apple.iCloud:
          enabled: 1
        com.apple.ApplicationGroups.iOS:
          enabled: 1
    sources:
      - path: Widgets
      - path: Shared
    dependencies:
      - package: NestedKit
        product: NestedCore
      - package: NestedKit
        product: NestedData
    entitlements:
      path: Widgets/NestedWidgets.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.com.yetra.nest]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.security.application-groups: [group.com.yetra.nest]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yetra.nest.widgets
        INFOPLIST_FILE: Widgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

  NestedWatch:
    type: application
    platform: watchOS
    attributes:
      SystemCapabilities:
        com.apple.iCloud:
          enabled: 1
        com.apple.ApplicationGroups.iOS:
          enabled: 1
    sources:
      - path: Watch
      - path: Shared/EventStyle.swift
      - path: Shared/SharedStore.swift
      - path: Shared/Intents
    dependencies:
      - package: NestedKit
        product: NestedCore
      - package: NestedKit
        product: NestedData
      - target: NestedWatchWidgets
    entitlements:
      path: Watch/NestedWatch.entitlements
      properties:
        aps-environment: development
        com.apple.developer.icloud-container-identifiers: [iCloud.com.yetra.nest]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.security.application-groups: [group.com.yetra.nest]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yetra.nest.watchkitapp
        INFOPLIST_FILE: Watch/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES

  NestedWatchWidgets:
    type: app-extension
    platform: watchOS
    attributes:
      SystemCapabilities:
        com.apple.iCloud:
          enabled: 1
        com.apple.ApplicationGroups.iOS:
          enabled: 1
    sources:
      - path: WatchWidgets
      - path: Shared/EventStyle.swift
      - path: Shared/SharedStore.swift
      - path: Shared/Widgets
    dependencies:
      - package: NestedKit
        product: NestedCore
      - package: NestedKit
        product: NestedData
    entitlements:
      path: WatchWidgets/NestedWatchWidgets.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.com.yetra.nest]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.security.application-groups: [group.com.yetra.nest]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yetra.nest.watchkitapp.widgets
        INFOPLIST_FILE: WatchWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES

  NestedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      # NestedKit modules come in through the host app (linked once, so there's a single
      # copy of shared state such as the configured store).
      - target: Nested
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Nested.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Nested
        BUNDLE_LOADER: $(TEST_HOST)
